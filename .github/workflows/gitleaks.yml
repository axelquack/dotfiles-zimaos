# Public repositories.
# Personal GitHub accounts need no gitleaks-action license.
# Organization accounts need a free license key from gitleaks.io. This workflow
# does not set GITLEAKS_LICENSE, so it stays on the free personal-account path.
# gitleaks-action v2 is not used: GitHub removed Node 20 from hosted runners
# on 2026-09-16, and v2 stops on those runners. v3 is the current action.
name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
